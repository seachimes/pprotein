version: 2

before:
  hooks:
    - go mod tidy
    - pnpm --dir view install --frozen-lockfile
    - pnpm --dir view run build
builds:
  - id: pprotein
    binary: pprotein
    main: ./cli/pprotein
    flags:
      - -trimpath
    # Without this the UI would fall back to a bare commit hash, since
    # goreleaser builds from a detached checkout.
    ldflags:
      - -s -w -X github.com/kaz/pprotein/internal/version.Version={{.Version}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
  - id: pprotein-agent
    binary: pprotein-agent
    main: ./cli/pprotein-agent
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/kaz/pprotein/internal/version.Version={{.Version}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
archives:
  - files:
      - nothing*
      - LICENSE
checksum:
  disable: true
changelog:
  use: github-native
